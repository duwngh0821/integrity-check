name: build-dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (no SDK)
        run: git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Get iOS SDK
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make

      - name: Collect dylib
        run: |
          mkdir -p out
          find "$HOME/work" -name "*.dylib" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TamperAlert-dylib
          path: out/**
